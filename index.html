<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earn Crypto</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4efe6;
      color: #333;
      margin: 0;
      padding: 15px;
      text-align: center;
    }
    .header-box {
      background: #e8e2d5;
      padding: 10px 15px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .nav-tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #fff;
      font-weight: bold;
      font-size: 12px;
    }
    .tab-btn.active {
      background: #d4e157;
    }
    .accrued-box {
      background: #fff8e7;
      border: 1px solid #e0d0b0;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .btn-collect {
      background: #fbc02d;
      border: none;
      padding: 10px 25px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .grid-cell {
      background: #fff;
      border: 1px solid #ddd;
      height: 65px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
  </style>
</head>
<body>

  <!-- Top User Dashboard -->
  <div class="header-box">
    <div>🪙 Balance: <b id="user-balance">0.53</b></div>
    <div id="username">User</div>
  </div>

  <!-- Navigation -->
  <div class="nav-tabs">
    <button class="tab-btn active">Game</button>
    <button class="tab-btn">Deposit</button>
    <button class="tab-btn">Withdraw</button>
    <button class="tab-btn">Referrals</button>
  </div>

  <!-- Mining Counter -->
  <div class="accrued-box">
    <div style="font-size: 14px; color: #666;">Accrued</div>
    <h2 id="accrued-val" style="margin: 8px 0;">🪙 0.073300</h2>
    <button class="btn-collect" onclick="collectCoins()">COLLECT</button>
  </div>

  <!-- Character Grid -->
  <div class="grid">
    <div class="grid-cell">🦅</div>
    <div class="grid-cell">🦅</div>
    <div class="grid-cell">🦅</div>
    <div class="grid-cell">🦅</div>
    <div class="grid-cell"></div>
    <div class="grid-cell"></div>
    <div class="grid-cell"></div>
    <div class="grid-cell"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
    }

    let accrued = 0.073300;
    let balance = 0.53;

    setInterval(() => {
      accrued += 0.000002;
      document.getElementById('accrued-val').innerText = "🪙 " + accrued.toFixed(6);
    }, 1000);

    function collectCoins() {
      balance += accrued;
      accrued = 0;
      document.getElementById('user-balance').innerText = balance.toFixed(2);
      document.getElementById('accrued-val').innerText = "🪙 0.000000";
    }
  </script>
</body>
                                     </html>
